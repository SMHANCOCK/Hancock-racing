<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a50000"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>HANCOCK Racing Co.</title>
<style>html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#080b10}#game{display:block;border:0;width:100%;height:100%;height:100dvh}html:fullscreen,html:fullscreen body{width:100%;height:100%}html:fullscreen #game{height:100%}</style></head>
<body><iframe id="game" title="HANCOCK Racing Co." allow="fullscreen; screen-wake-lock" allowfullscreen src="index.html?embedded=1&v=14925"></iframe><script>
const frame=document.getElementById('game');
const requestedVersion=new URLSearchParams(location.search).get('v') || '14925';
if(requestedVersion&&/^\d{2,12}$/.test(requestedVersion)){
 const gameURL=new URL('index.html',location.href);
 gameURL.searchParams.set('embedded','1');
 gameURL.searchParams.set('v',requestedVersion);
 const racer=new URLSearchParams(location.search).get('racer');
 if(racer)gameURL.searchParams.set('racer',racer.slice(0,24));
 frame.src=gameURL.href;
}
frame.addEventListener('load',()=>{try{frame.contentWindow.focus()}catch(e){}});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();frame.contentWindow.postMessage({hancockControl:true,code:e.code,down:true},location.origin)}});
window.addEventListener('keyup',e=>{frame.contentWindow.postMessage({hancockControl:true,code:e.code,down:false},location.origin)});
window.addEventListener('blur',()=>frame.contentWindow.postMessage({hancockControl:true,reset:true},location.origin));
</script></body></html>
