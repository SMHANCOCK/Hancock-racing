<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAKURA PASS — Track Test</title><style>body{margin:0;overflow:hidden;background:#b8d6e8;font-family:Arial;color:white}#ui{position:fixed;top:14px;left:16px;text-shadow:0 2px 4px #000;font-weight:bold;pointer-events:none}#help{position:fixed;bottom:14px;left:16px;background:#101820bb;padding:10px;border-radius:8px;font-size:13px}a{color:white}#speed{font-size:28px}</style></head><body><div id="ui">SAKURA PASS · TEST CIRCUIT<div id="speed">0 MPH</div><div id="lap">LAP 1</div></div><div id="help">WASD / arrows to drive · Space to drift · R to reset · <a href="play.html">Original game</a></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0xb9d5e7);scene.fog=new T.Fog(0xb9d5e7,180,550);
const camera=new T.PerspectiveCamera(72,innerWidth/innerHeight,.1,900),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x768978,2.3));const sun=new T.DirectionalLight(0xffe2bd,2);sun.position.set(-90,160,-80);scene.add(sun);
const mat=(c)=>new T.MeshLambertMaterial({color:c,side:T.DoubleSide}),road=mat(0x30343b),edge=mat(0xdce0df),red=mat(0xa92838),grass=mat(0x63875c),lake=mat(0x6ba5b7),bark=mat(0x554039),pink=[mat(0xf5b3ca),mat(0xffc7d9),mat(0xe99dbb)],dark=mat(0x35404a),snow=mat(0xf1f5f8);
function add(g,m,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o}
add(new T.PlaneGeometry(1000,1000),grass,0,-.25,0).rotation.x=-Math.PI/2;
const water=add(new T.PlaneGeometry(330,330),lake,-205,-.13,0);water.rotation.x=-Math.PI/2;
const pts=[[0,-125],[55,-132],[120,-110],[167,-65],[170,-5],[143,50],[90,89],[35,103],[-25,105],[-79,90],[-125,52],[-143,5],[-125,-53],[-80,-108],[-32,-127]];
const curve=new T.CatmullRomCurve3(pts.map(p=>new T.Vector3(p[0],0,p[1])),true,'catmullrom',.45);const n=520,width=24;
function frame(t){const p=curve.getPointAt((t+1)%1),tan=curve.getTangentAt((t+1)%1),normal=new T.Vector3(-tan.z,0,tan.x);return {p,tan,normal}}
function ribbon(a,b,y,m){const v=[],ind=[];for(let i=0;i<=n;i++){const f=frame(i/n);for(const d of [a,b]){const p=f.p.clone().addScaledVector(f.normal,d);v.push(p.x,y,p.z)}}for(let i=0;i<n;i++){const j=i*2;ind.push(j,j+2,j+1,j+1,j+2,j+3)}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.setIndex(ind);g.computeVertexNormals();add(g,m)}
ribbon(-width/2-2,width/2+2,.015,dark);ribbon(-width/2,width/2,.04,road);ribbon(-width/2,-width/2+.35,.06,edge);ribbon(width/2-.35,width/2,.06,edge);
for(let i=0;i<135;i++){const f=frame(i/135);const p=f.p.clone().addScaledVector(f.normal,0);add(new T.BoxGeometry(.24,.025,2.7),edge,p.x,.075,p.z).rotation.y=Math.atan2(f.tan.x,f.tan.z)}
for(let i=0;i<8;i++){const t=(i+.4)/9,f=frame(t);for(let k=0;k<10;k++){const p=f.p.clone().addScaledVector(f.normal,-width/2+1+k*2.4);const stripe=add(new T.BoxGeometry(1.1,.025,2.6),red,p.x,.09,p.z);stripe.rotation.y=Math.atan2(f.tan.x,f.tan.z)}}
const trunk=new T.CylinderGeometry(.4,.65,5,5),flower=new T.IcosahedronGeometry(3.5,1),petalGeo=new T.PlaneGeometry(.65,.35),petals=[],clock=new T.Clock();
for(let i=0;i<112;i++){const t=i/112,f=frame(t),side=i%2?1:-1,d=width/2+6+(i%5)*2.3,p=f.p.clone().addScaledVector(f.normal,side*d);const tr=add(trunk,bark,p.x,2.5,p.z);tr.rotation.z=Math.sin(i*13)*.08;const crown=add(flower,pink[i%3],p.x,6.8,p.z);crown.scale.set(1.3,.7,1.2);if(i%3===0){for(let k=0;k<4;k++){const q=add(new T.BoxGeometry(.8,.02,.45),pink[k%3],p.x+(k-2)*1.3,.08,p.z+((i+k)%5-2)*1.2);q.rotation.y=i+k}}}
for(let i=0;i<55;i++){const f=frame((i*0.618)%1),p=f.p.clone().addScaledVector(f.normal,(i%2?1:-1)*(width/2+2));const o=add(petalGeo,pink[i%3],p.x,3+(i%9),p.z);o.rotation.x=-Math.PI/2;petals.push({o,base:o.position.y,phase:i*2.4})}
const railRed=mat(0xb42834);for(let i=0;i<48;i++){const f=frame(.48+i*.0025),p=f.p.clone().addScaledVector(f.normal,-width/2-2);add(new T.BoxGeometry(.45,2,.45),railRed,p.x,1,p.z);if(i%2===0){const bar=add(new T.BoxGeometry(.35,.22,3.6),railRed,p.x,1.8,p.z);bar.rotation.y=Math.atan2(f.tan.x,f.tan.z)}}
for(let i=0;i<10;i++){const f=frame((i+.4)/10),p=f.p.clone().addScaledVector(f.normal,width/2+3);const pole=add(new T.BoxGeometry(.25,3,.25),dark,p.x,1.5,p.z);const board=add(new T.BoxGeometry(3,2,.3),dark,p.x,3.1,p.z);board.rotation.y=Math.atan2(f.tan.x,f.tan.z);const c=document.createElement('canvas');c.width=128;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#171b20';ctx.fillRect(0,0,128,96);ctx.fillStyle='#fff';ctx.font='bold 72px Arial';ctx.textAlign='center';ctx.fillText(String(i+1),64,74);const sign=new T.Mesh(new T.PlaneGeometry(2.8,1.9),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide}));sign.position.set(p.x,3.1,p.z);sign.rotation.y=board.rotation.y;scene.add(sign)}
// Distant low-poly mountain and city skyline.
const mountain=add(new T.ConeGeometry(95,125,5),mat(0x727b87),-260,55,-290);mountain.rotation.y=.5;add(new T.ConeGeometry(30,35,5),snow,-260,115,-290).rotation.y=.5;
for(let i=0;i<27;i++){const h=20+(i*31%65),x=140+i*12,z=-295+(i%4)*9;add(new T.BoxGeometry(9,h,11),mat(i%3?0x687a89:0x8496a5),x,h/2,z)}
const car=new T.Group();scene.add(car);const chassis=new T.Mesh(new T.BoxGeometry(3.5,1.2,6.5),red);chassis.position.y=1.2;car.add(chassis);const cabin=new T.Mesh(new T.BoxGeometry(2.7,1.1,2.8),dark);cabin.position.set(0,2.1,-.4);car.add(cabin);for(const x of [-1.7,1.7])for(const z of [-2,2]){const w=new T.Mesh(new T.CylinderGeometry(.85,.85,.5,10),dark);w.rotation.z=Math.PI/2;w.position.set(x,.75,z);car.add(w)}
let t=0,speed=0,lateral=0,drift=0,lap=1;const keys={};onkeydown=e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR'){t=0;speed=0;lateral=0}};onkeyup=e=>keys[e.code]=false;
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04),forward=keys.KeyW||keys.ArrowUp,back=keys.KeyS||keys.ArrowDown,steer=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);speed+=((forward?54:back?-22:0)-speed)*dt*(forward?1.1:back?1.6:.48);speed=Math.max(-12,Math.min(55,speed));const drifting=!!keys.Space;drift+=(steer*(drifting?1.8:1.15)-drift)*dt*(drifting?2.1:4);lateral+=drift*speed*dt*.15;lateral=Math.max(-width/2+2,Math.min(width/2-2,lateral));const prev=t;t=(t+speed*dt/curve.getLength())%1;if(t<prev&&speed>0)lap++;const f=frame(t),p=f.p.clone().addScaledVector(f.normal,lateral);car.position.set(p.x,.15,p.z);car.rotation.y=Math.atan2(f.tan.x,f.tan.z)+drift*.14;const desired=p.clone().addScaledVector(f.tan,-19).add(new T.Vector3(0,10,0));camera.position.lerp(desired,1-Math.exp(-5*dt));camera.lookAt(p.clone().addScaledVector(f.tan,16).add(new T.Vector3(0,2,0)));const tm=performance.now()*.001;for(const q of petals){q.o.position.y=q.base+Math.sin(tm*1.4+q.phase)*1.3;q.o.rotation.z=tm*.25+q.phase}document.getElementById('speed').textContent=Math.round(Math.abs(speed)*2.1)+' MPH';document.getElementById('lap').textContent='LAP '+lap;renderer.render(scene,camera)}tick();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
